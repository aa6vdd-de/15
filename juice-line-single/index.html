<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جوس لاين | التحليل المالي</title><style>:root{font-family:Tahoma,Arial,sans-serif;color:#eef3f9;background:#091426}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#253c5366,transparent 38%),#091426}header{padding:35px max(20px,calc((100% - 1100px)/2));border-bottom:1px solid #2b4058;background:#102039}h1{margin:0;color:#e5bd6d;font-size:36px}header p{color:#aebed2;margin:5px 0}nav{position:sticky;top:0;z-index:2;display:flex;gap:8px;flex-wrap:wrap;padding:12px max(20px,calc((100% - 1100px)/2));background:#102039ee;border-bottom:1px solid #2b4058}nav a{color:#d6e0ec;text-decoration:none;padding:9px 15px;border-radius:7px}nav a:hover{background:#deb65f22;color:#f0cc83}main{max-width:1100px;margin:auto;padding:25px 20px 60px}section{margin-bottom:45px}h2{font-size:25px;color:#f1d08d;margin:0 0 18px}h3{color:#d8e1ed}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.cards div{background:#112139;border:1px solid #2b4058;border-radius:10px;padding:20px}.cards b{display:block;font:600 27px Arial;color:#e9c778;margin-bottom:8px}.cards span{color:#a9b9cc;font-size:14px}.chart{height:190px;display:flex;align-items:end;gap:7px;background:#112139;border:1px solid #2b4058;border-radius:10px;padding:20px}.bar{flex:1;background:#deb65f;border-radius:4px 4px 0 0;min-height:5px;position:relative}.bar span{position:absolute;bottom:-22px;width:100%;text-align:center;color:#94a8bf;font-size:11px}form{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;background:#112139;border:1px solid #2b4058;border-radius:10px;padding:22px}input,button{width:100%;padding:12px;border-radius:7px;border:1px solid #3b526c;background:#0d1c31;color:#eef3f9;font:inherit}button{grid-column:1/-1;background:#deb65f;color:#102039;font-weight:bold;cursor:pointer}button:hover{background:#f0ce88}#message{color:#74d5b9}.tables{display:grid;grid-template-columns:1fr 1fr;gap:18px}.tables>div{background:#112139;border:1px solid #2b4058;border-radius:10px;padding:18px}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #2b4058;text-align:right}th{color:#deb65f;font-size:14px}td{color:#c7d3e2}@media(max-width:700px){.cards,.tables,form{grid-template-columns:1fr}.cards b{font-size:22px}}
</style></head><body><header><h1>جوس لاين</h1><p>النظام المالي والتحليلي 2026</p></header><nav><a href="#overview">نظرة عامة</a><a href="#entry">إدخال البيانات</a><a href="#products">الأكثر مبيعًا وربحًا</a></nav><main><section id="overview"><h2>النظرة العامة</h2><div class="cards"><div><b id="salesTotal">0</b><span>إجمالي الإيرادات</span></div><div><b id="costTotal">0</b><span>إجمالي التكاليف</span></div><div><b id="profitTotal">0</b><span>صافي الربح</span></div><div><b id="marginTotal">0%</b><span>هامش الربح</span></div></div><div class="chart" id="months"></div></section><section id="entry"><h2>إدخال بيانات المنتج</h2><form id="saleForm"><input name="product" placeholder="اسم المنتج" required><input name="category" placeholder="تصنيف المنتج" required><input name="qty" type="number" min="1" placeholder="الكمية" required><input name="revenue" type="number" min="0" step="0.01" placeholder="الإيراد بالريال" required><input name="cost" type="number" min="0" step="0.01" placeholder="التكلفة بالريال" required><input name="date" type="date" min="2026-01-01" max="2026-12-31" required><button>حفظ البيانات</button></form><p id="message"></p></section><section id="products"><h2>العصائر الأكثر مبيعًا والأكثر ربحًا</h2><div class="tables"><div><h3>الأكثر مبيعًا</h3><table><thead><tr><th>العصير</th><th>الكمية</th><th>الإيراد</th></tr></thead><tbody id="bestSold"></tbody></table></div><div><h3>الأكثر ربحًا</h3><table><thead><tr><th>العصير</th><th>الربح</th><th>الهامش</th></tr></thead><tbody id="bestProfit"></tbody></table></div></div></section></main><script>if(!localStorage.getItem('juiceLineSales2026'))localStorage.setItem('juiceLineSales2026',JSON.stringify([{product:'مانجو',category:'عصائر',qty:1400,revenue:22400,cost:7280,date:'2026-01-15'},{product:'برتقال',category:'عصائر',qty:1500,revenue:18000,cost:4650,date:'2026-02-15'},{product:'فراولة',category:'عصائر',qty:1100,revenue:16500,cost:5280,date:'2026-03-15'},{product:'أفوكادو',category:'عصائر',qty:800,revenue:16000,cost:7120,date:'2026-04-15'},{product:'كوكتيل',category:'عصائر',qty:700,revenue:12600,cost:3640,date:'2026-05-15'},{product:'ليمون ونعناع',category:'عصائر',qty:500,revenue:4500,cost:1010,date:'2026-06-15'}]));</script><script>const key='juiceLineSales2026';const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];let records=JSON.parse(localStorage.getItem(key)||'[]');const money=n=>new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2}).format(n)+' ريال';function render(){const revenue=records.reduce((s,r)=>s+r.revenue,0),cost=records.reduce((s,r)=>s+r.cost,0),profit=revenue-cost; salesTotal.textContent=money(revenue);costTotal.textContent=money(cost);profitTotal.textContent=money(profit);marginTotal.textContent=revenue?(profit/revenue*100).toFixed(1)+'%':'0%';const monthly=months.map((_,i)=>records.filter(r=>new Date(r.date).getMonth()===i).reduce((s,r)=>s+r.revenue,0));const max=Math.max(1,...monthly);monthsEl.innerHTML=monthly.map((v,i)=>`<div class="bar" style="height:${Math.max(5,v/max*100)}%" title="${months[i]}: ${money(v)}"><span>${i+1}</span></div>`).join('');const groups={};records.forEach(r=>{const g=groups[r.product]||{product:r.product,qty:0,revenue:0,cost:0};g.qty+=r.qty;g.revenue+=r.revenue;g.cost+=r.cost;groups[r.product]=g});const rows=Object.values(groups);bestSold.innerHTML=rows.sort((a,b)=>b.qty-a.qty).slice(0,5).map(r=>`<tr><td>${r.product}</td><td>${r.qty}</td><td>${money(r.revenue)}</td></tr>`).join('')||'<tr><td colspan="3">لا توجد بيانات بعد</td></tr>';bestProfit.innerHTML=rows.sort((a,b)=>(b.revenue-b.cost)-(a.revenue-a.cost)).slice(0,5).map(r=>`<tr><td>${r.product}</td><td>${money(r.revenue-r.cost)}</td><td>${r.revenue?((r.revenue-r.cost)/r.revenue*100).toFixed(1):0}%</td></tr>`).join('')||'<tr><td colspan="3">لا توجد بيانات بعد</td></tr>'}const monthsEl=document.getElementById('months');saleForm.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const r={product:f.get('product').trim(),category:f.get('category').trim(),qty:+f.get('qty'),revenue:+f.get('revenue'),cost:+f.get('cost'),date:f.get('date')};if(!r.date.startsWith('2026-')||r.qty<1||r.revenue<0||r.cost<0){message.textContent='تحقق من البيانات والتاريخ ضمن 2026';return}records.push(r);localStorage.setItem(key,JSON.stringify(records));e.target.reset();message.textContent='تم حفظ البيانات وتحديث المؤشرات';render()});render();
</script></body></html>
